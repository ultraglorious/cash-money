name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` also fails when package.json and the lockfile disagree, which
      # is worth catching on its own.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The Rust shell is 300 lines of file plumbing whose tests are pure path
  # logic, but building it needs the whole webkit/gtk toolchain — so compile
  # and test the crate alone rather than the Tauri bundle.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
